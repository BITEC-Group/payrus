name: CI (quality, security, provenance)

on:
  pull_request:
  push:
    branches: [rebuild, main]
  schedule:
    - cron: "0 5 * * 1" # weekly dependency/vulnerability re-scan

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # PRS-NFR-021 / INT-001: the HTTP/RPC surface stays described in OpenAPI 3.1 and AsyncAPI, and both must validate.
      - run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml --skip-rule=no-empty-servers
      - run: npx --yes @asyncapi/cli@latest validate docs/api/asyncapi.yaml

  regression:
    # The repo's own spec tests (routes, MFA guards, RLS hides private data from anonymous callers, role/profile
    # invariants, every table the apps call exists) run on every push, so they no longer depend on a local run.
    # They read both apps side by side (App/ and ops-console/), so the Console is checked out next to the App,
    # the same layout as the local workspace. Only the publishable URL and anon key are used - the same public
    # values the deployed bundle ships.
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: "https://iqbsxyltixztmysqsbig.supabase.co"
      VITE_SUPABASE_ANON_KEY: "sb_publishable_F5j6JBm34JwQKJjbouvEBg_-KyCxYWv"
    defaults:
      run:
        working-directory: PayRUs/App
    steps:
      - uses: actions/checkout@v4
        with:
          path: PayRUs/App
      - uses: actions/checkout@v4
        with:
          repository: BITEC-Group/PayRus-Console
          path: PayRUs/ops-console
      - uses: pnpm/action-setup@v4
        with:
          version: 12
          package_json_file: PayRUs/App/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: PayRUs/App/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm regression
      - run: node scripts/spec-tests/static.mjs || true # reports findings; the blocking gate is pnpm regression

  security:
    # PRS-NFR-008: SCA, secret scan and SAST must pass before release; findings need a recorded risk acceptance to be waived.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      # The gitleaks GitHub Action needs a paid licence on organisation repositories; the open-source binary does not.
      - name: Secret scan (gitleaks)
        run: |
          V=$(curl -fsS https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${V}/gitleaks_${V#v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --report-format json --report-path gitleaks.json || {
            # list each finding (rule, file, line, commit; the secret itself stays redacted) as an annotation on the run
            node -e 'const m={};for(const f of JSON.parse(require("fs").readFileSync("gitleaks.json","utf8"))){const k=f.RuleID+" "+f.File;(m[k]??=new Set()).add(f.Commit.slice(0,7)+":"+f.StartLine)}for(const [k,v] of Object.entries(m))console.log("::error title=gitleaks::"+k+" x"+v.size+" e.g. "+[...v].slice(0,3).join(","))'
            exit 1
          }
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  sbom:
    # PRS-NFR-014: SBOM and signed build provenance for every build.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm sbom --sbom-format cyclonedx --prod > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/**
