name: Deploy to GitHub Pages

on:
  push:
    branches: [rebuild]
  workflow_dispatch:

permissions:
  contents: write # create the release tag after a successful deploy
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compute release tag (shown in Settings → About, and used to tag this deploy)
        run: |
          echo "APP_VERSION=release-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "APP_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - run: pnpm build
        env:
          GITHUB_PAGES: "true"
          # Public/publishable values only (see .env.example) — never put a
          # real secret (service role key, GOOGLE_MAPS_API_KEY) in a VITE_
          # var or this workflow; those live only in Convex's own env store.
          VITE_SUPABASE_URL: "https://iqbsxyltixztmysqsbig.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_F5j6JBm34JwQKJjbouvEBg_-KyCxYWv"
          VITE_CONVEX_URL: "https://flexible-skunk-8.eu-west-1.convex.cloud"
          VITE_CONVEX_CLOUD_URL: "https://flexible-skunk-8.eu-west-1.convex.cloud"
          VITE_CONVEX_SITE_URL: "https://flexible-skunk-8.eu-west-1.convex.site"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  tag-release:
    # The tag and notes are created only after Pages accepted the deploy, so a tag always names a live build.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release tag and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="release-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG (deployed from rebuild)" || echo "tag $TAG already exists"
